services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: task_manager
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d task_manager"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
