services:
  - type: web
    name: weblabs-task-manager-api
    runtime: node
    plan: free
    rootDir: lab 3
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24.14.0'
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: weblabs-task-manager-db
          property: connectionString
databases:
  - name: weblabs-task-manager-db
    plan: free
    ipAllowList: []
